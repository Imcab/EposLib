# ===========================================================================
# controller_manager configuration for the EPOS4 bring-up description.
#
# update_rate is the frequency of the read()/write() loop. Keep it equal to
# the SYNC rate of bus.yml (sync_period: 10000 us = 100 Hz). write() stages a
# setpoint and the NEXT SYNC carries it, so a faster loop only overwrites
# setpoints that never leave the master, and a slower one leaves SYNCs that
# repeat the previous target - which the drive, interpolating over 0x60C2,
# turns into a stall followed by a jump.
#
#   sync_period 10000 us  ->  100 Hz  ->  update_rate: 100
# ===========================================================================
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Follows trajectories. This is what Cyclic Synchronous Position is for.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Alternative for bring-up and manual jogging: jump to a position, no
    # trajectory. Do NOT activate it together with arm_controller - both
    # claim the same command interfaces and the second one is rejected.
    arm_position_controller:
      type: position_controllers/JointGroupPositionController


arm_controller:
  ros__parameters:
    joints:
      - shoulder

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false

    # Closed loop against the measured position, so a joint that falls
    # behind is seen falling behind instead of being assumed on track.
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      shoulder:
        trajectory: 0.15  # rad, max deviation while moving
        goal: 0.05        # rad, max error at the end


arm_position_controller:
  ros__parameters:
    joints:
      - shoulder
